name: Compile LaTeX Notes to PDF

on:
  push:
    branches: ["main"] # This will cover both just in case!
  workflow_dispatch: # THIS ADDS THE MANUAL RUN BUTTON

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # 2. This grabs your repository's code
      - name: Set up Git repository
        uses: actions/checkout@v4

      # 3. This runs the LaTeX compiler on your specific file
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: README.tex

      # 4. This uploads the finished PDF so you can download it
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-notes-pdf
          path: README.pdf
